name: Deploy to Oracle VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-instafb-oracle-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate bot and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Build Docker image
        run: docker build --pull -t personal-instafb-bot:ci .

  deploy:
    name: Deploy Personal Instagram/Facebook bot
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy container on Oracle VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_PRIVATE_KEY:?Missing ORACLE_SSH_PRIVATE_KEY secret}"
          : "${ORACLE_SSH_KNOWN_HOSTS:?Missing ORACLE_SSH_KNOWN_HOSTS secret}"

          ORACLE_HOST="$(printf '%s' "$ORACLE_HOST" | tr -d '[:space:]')"
          PORT="${ORACLE_SSH_PORT:-22}"

          python - "$ORACLE_HOST" <<'PY'
          import ipaddress
          import sys
          ipaddress.ip_address(sys.argv[1])
          print("Validated Oracle host IP.")
          PY

          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_deploy \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/bot"
          ENV_FILE="$APP_DIR/.env"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Repository not found at $APP_DIR." >&2
            exit 1
          fi
          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing $ENV_FILE." >&2
            exit 1
          fi
          grep -qE '^BOT_TOKEN=.+$' "$ENV_FILE" || {
            echo "BOT_TOKEN is missing from $ENV_FILE." >&2
            exit 1
          }

          # Use the VM's established updater so deployment keeps its image name,
          # container name, environment file, and cookie mount in sync.
          cd "$HOME"
          ./update.sh bot
          if [ "$(sudo docker inspect -f '{{.State.Running}}' tgbot)" != "true" ]; then
            echo "Container tgbot is not running after update." >&2
            sudo docker logs --tail 80 tgbot >&2 || true
            exit 1
          fi
          echo "Deployment successful: tgbot"
          sudo docker ps --filter "name=^/tgbot$" --format 'table {{.Names}}\t{{.Status}}'
          REMOTE
